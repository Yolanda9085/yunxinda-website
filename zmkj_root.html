  // 点击获取验证码
    $(".yzmbtns").on('click',hqyzm);
    function hqyzm() {
      var phone =$('#phone').val();
      //验证手机号是否正确
      if(!phone){
        layer.alert('请输入手机号码！', {icon: '', title:''});
        return false;
      }
      
      var patrn = /(^0{0,1}1[3|4|5|6|7|8|9][0-9]{9}$)/;
      if (!patrn.exec(phone)){
        layer.alert('请输入正确11位有效的手机号码！', {icon: '', title:''});
        return false;
      }
	  var sf=$("input[name='sf']:checked").val();
      // var reg = new RegExp("[\\u4E00-\\u9FFF]+","g");
      $.ajax({
        type: "POST",
        url: "/index.php/Newindex/checkPhoneExis.html",
        data: {'phone':phone,'sf':sf},
        success: function(data){
          if(data.status == 'n') {
            layer.alert(data.msg, {icon: '', title:''});
          }else {
            $(".modalOuter").show();
		        $(".markbox").show();
          }
        }
      });
    }
    // 图形验证码输入后点击确定按钮事件
    $(".quding").click(function(){
      var txyzm =$('#txyzm').val();
      if(!txyzm){
        layer.alert('请输入图形验证码！', {icon: '', title:''});
        return false;
      }
      // var reg = new RegExp("[\\u4E00-\\u9FFF]+","g");
      $.post("/index.php/Newindex/verifyCode.html",
        {
          code:txyzm
        },
        function(data,status){
          if(data.status == 'n') {
            layer.alert(data.msg, {icon: '', title:''});
            $("#verify").attr("src","/index.php/Newindex/verify.html"+'?'+Math.random());   // 重新生成图形验证码
          }else {
            $(".modalOuter").hide();
		        $(".markbox").hide();
            $("#txyzm").val('');
            var phone =$('#phone').val();
            var times=$('#time').val();
            var mcode=$('#mcode').val();
            $(".yzmbtns").addClass("disabled"); //点击获取验证码后，禁用该按钮，开始倒计时
            $(".yzmbtns").off('click');
            var sf=$("input[name='sf']:checked").val();
			
            $.post("/index.php/Newindex/code.html",
              {
                phone:phone,time:times,mcode:mcode,sf:sf
              },
              function(data,status){
                // $("#msg_id").val(data);
                if(data.status == 'n') {
                  layer.alert(data.msg, {icon: 2, title:''});
                  $("#verify").attr("src","/index.php/Newindex/verify.html"+'?'+Math.random());   // 重新生成图形验证码
                  return false;
                }else {
                  $("#msg_id").val(data.msg);
                }
              }
            );
            $("#verify").attr("src","/index.php/Newindex/verify.html"+'?'+Math.random());   // 重新生成图形验证码
            var time = 60; //倒计时时间，自定义
            var $this = $(".yzmbtns"); //备份，定时器是异步的，此this非彼this
            var timer = setInterval(function () {
              time--; //开始倒计时
              if (time == 0) {
                //当倒计时为0秒时，关闭定时器，更改按钮显示文本并设置为可以点击
                clearInterval(timer);
                $this.html("发送验证码");
                $this.removeClass("disabled");
                $(".yzmbtns").on('click',hqyzm);
                return;
              }
              $this.html(time + "秒后重获"); //显示剩余秒数
            }, 1000); //定时器一秒走一次，每次减一，就是倒计时了
          }
        }
      )
    });

    //按钮提交表单
    function ts(){
      var phone=$("input[name='phone']").val().replace(/\s*/g,"");
      var password=$("input[name='password']").val().replace(/\s*/g,"");
      var yzm=$("input[name='yzm']").val().replace(/\s*/g,"");
      var rememberpass=$("input[name='rememberpass']:checked").val();

      if(!phone){

      }
